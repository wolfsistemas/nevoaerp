<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Névoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Névoa">
    <meta name="apple-mobile-web-app-title" content="Névoa">
    <meta name="theme-color" content="#0f172a"> <link rel="manifest" href="manifest.json">


    <!-- ///////////////////////////////////////////////////////////////////////////// -->
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #059669; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 p-8 flex flex-col items-center">
            <div class="w-24 h-24 rounded-full border-4 border-emerald-600 mb-4 shadow-lg bg-white overflow-hidden p-2">
                <img src="logo.png" class="w-full h-full object-contain" alt="Logo Névoa" />
            </div>
            <h1 class="text-2xl font-bold tracking-wider text-white">NÉVOA</h1>
            <p class="text-emerald-500 text-sm font-medium mt-1">Acesso ao Sistema</p>
        </div>

        <div class="p-8">
            <form id="loginForm" onsubmit="fazerLogin(event)" class="space-y-5">
                
                <div id="msg-erro" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-bold border border-red-200">
                    Usuário ou senha incorretos.
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Usuário ou E-mail</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="login_user" required placeholder="Seu nome de usuário ou e-mail" class="w-full p-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50">
                    </div>
                </div>

                    <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                        <input type="password" 
                               id="senha" 
                               placeholder="Sua senha" 
                               autocomplete="current-password"
                               class="w-full p-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50">
                    </div>
                    <div class="text-right mt-1">
                        <button type="button" onclick="abrirRecuperacao()" class="text-xs text-slate-500 hover:text-emerald-700 hover:underline font-medium">Esqueci minha senha</button>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mt-4">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
                
                <div id="loading" class="hidden justify-center items-center gap-2 py-3 mt-4">
                    <div class="loader"></div>
                    <span class="text-slate-500 font-bold text-sm">Validando...</span>
                </div>

                <p class="text-center text-sm text-slate-500 pt-2">
                    Não tem conta?
                    <a href="cadastro.html" class="text-indigo-700 font-bold hover:underline">Criar conta</a>
                </p>

                <p class="text-center text-xs text-slate-400 pt-1">
                    <a href="landing.html" class="hover:text-slate-600 hover:underline">Conheça o Névoa e os planos</a>
                </p>

            </form>
        </div>
    </div>

    <div id="reset-overlay" class="hidden fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-slate-900 p-5">
                <h2 class="text-white font-bold text-lg">Recuperar acesso</h2>
                <p class="text-slate-400 text-xs mt-1">Enviaremos um link para redefinir sua senha.</p>
            </div>
            <div class="p-6 space-y-4">
                <div id="reset-step1">
                    <label class="block text-sm font-bold text-slate-700 mb-1">Seu e-mail cadastrado</label>
                    <input type="email" id="reset-email" placeholder="voce@empresa.com.br" autocomplete="email"
                           class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50">
                    <button type="button" id="reset-send-btn" onclick="enviarLinkRecuperacao()"
                            class="w-full mt-3 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl">Enviar link</button>
                </div>
                <div id="reset-step2" class="hidden">
                    <p class="text-sm text-slate-600 mb-3">Defina sua nova senha.</p>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nova senha</label>
                    <input type="password" id="reset-nova" placeholder="Mínimo 6 caracteres" autocomplete="new-password"
                           class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50">
                    <label class="block text-sm font-bold text-slate-700 mb-1 mt-3">Confirmar nova senha</label>
                    <input type="password" id="reset-confirma" placeholder="Repita a nova senha" autocomplete="new-password"
                           class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50">
                    <button type="button" id="reset-save-btn" onclick="salvarNovaSenha()"
                            class="w-full mt-3 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl">Salvar nova senha</button>
                </div>
                <div id="reset-msg" class="hidden text-sm text-center font-bold rounded-lg p-3"></div>
                <button type="button" onclick="fecharRecuperacao()" class="w-full text-slate-400 text-xs hover:text-slate-600">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Valores vindos de config.js (injetados no deploy via GitHub Actions)
        const supabaseUrl = window.SUPABASE_URL;
        const supabaseKey = window.SUPABASE_ANON_KEY;
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Se chegou aqui por sessao expirada/sem login valido, limpa e avisa.
        (function motivoSessao() {
            const motivo = new URLSearchParams(window.location.search).get('motivo');
            if (motivo === 'sessao') {
                localStorage.removeItem('rv_user');
                localStorage.removeItem('rv_empresa');
                // Garante que uma sessao ainda valida tambem seja encerrada.
                sb.auth.signOut().catch(function () {});
                const msg = document.getElementById('msg-erro');
                if (msg) {
                    msg.textContent = "Sessão expirada. Faça login novamente.";
                    msg.classList.remove('hidden');
                }
            }
        })();

        // ===== Recuperacao de senha (fluxo PKCE) =====
        // O Supabase dispara PASSWORD_RECOVERY quando o usuario volta pelo link do e-mail.
        function resetMsg(texto, erro) {
            const el = document.getElementById('reset-msg');
            if (!el) return;
            el.textContent = texto;
            el.className = 'text-sm text-center font-bold rounded-lg p-3 ' + (erro
                ? 'bg-red-50 text-red-600 border border-red-200'
                : 'bg-emerald-50 text-emerald-700 border border-emerald-200');
        }

        function abrirRecuperacao() {
            document.getElementById('reset-overlay').classList.remove('hidden');
            document.getElementById('reset-step1').classList.remove('hidden');
            document.getElementById('reset-step2').classList.add('hidden');
            document.getElementById('reset-msg').classList.add('hidden');
        }

        function fecharRecuperacao() {
            document.getElementById('reset-overlay').classList.add('hidden');
        }

        function mostrarNovaSenha() {
            document.getElementById('reset-overlay').classList.remove('hidden');
            document.getElementById('reset-step1').classList.add('hidden');
            document.getElementById('reset-step2').classList.remove('hidden');
            document.getElementById('reset-msg').classList.add('hidden');
            const campo = document.getElementById('reset-nova');
            if (campo) campo.focus();
        }

        async function enviarLinkRecuperacao() {
            const email = (document.getElementById('reset-email').value || '').trim().toLowerCase();
            if (!email) return resetMsg('Informe seu e-mail.', true);
            const btn = document.getElementById('reset-send-btn');
            btn.disabled = true; btn.textContent = 'Enviando...';
            try {
                // redirectTo volta para esta pagina; com PKCE o Supabase anexa ?code=...
                await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + window.location.pathname
                });
                // Mensagem generica: nao revela se o e-mail existe na base.
                resetMsg('Se o e-mail estiver cadastrado, o link chegara em instantes. Verifique tambem a caixa de spam.', false);
            } catch (err) {
                resetMsg('Nao foi possivel enviar agora. Tente novamente.', true);
            } finally {
                btn.disabled = false; btn.textContent = 'Enviar link';
            }
        }

        async function salvarNovaSenha() {
            const p1 = document.getElementById('reset-nova').value || '';
            const p2 = document.getElementById('reset-confirma').value || '';
            if (p1.length < 6) return resetMsg('A senha deve ter ao menos 6 caracteres.', true);
            if (p1 !== p2) return resetMsg('As senhas nao conferem.', true);
            const btn = document.getElementById('reset-save-btn');
            btn.disabled = true; btn.textContent = 'Salvando...';
            try {
                const { error } = await sb.auth.updateUser({ password: p1 });
                if (error) throw error;
                resetMsg('Senha alterada! Redirecionando para o login...', false);
                await sb.auth.signOut();
                setTimeout(function () { window.location.replace('index.html'); }, 1500);
            } catch (err) {
                resetMsg('Erro ao salvar: ' + (err.message || 'tente novamente.'), true);
            } finally {
                btn.disabled = false; btn.textContent = 'Salvar nova senha';
            }
        }

        sb.auth.onAuthStateChange(function (event) {
            if (event === 'PASSWORD_RECOVERY') mostrarNovaSenha();
        });

        async function fazerLogin(e) {
            e.preventDefault();
            
            const entrada = document.getElementById('login_user').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-login');
            const load = document.getElementById('loading');
            const msgErro = document.getElementById('msg-erro');

            // Troca o botão pelo loading
            btn.classList.add('hidden');
            load.classList.remove('hidden');
            load.classList.add('flex');
            msgErro.classList.add('hidden');

            try {
                if (!entrada || !senha) throw new Error("Preencha usuário/e-mail e senha.");

                // Descobre o e-mail: se não digitou e-mail, resolve pelo login (usuário curto)
                let emailParaLogin = entrada;
                if (!entrada.includes('@')) {
                    const { data: emailEncontrado, error: rpcError } = await sb
                        .rpc('buscar_email_por_usuario', { usuario_busca: entrada });

                    if (rpcError || !emailEncontrado) {
                        // Mensagem generica: nao revela se o usuario existe (anti-enumeracao).
                        throw new Error("Usuário/e-mail ou senha incorretos.");
                    }
                    emailParaLogin = emailEncontrado;
                }

                // Autentica no Supabase Auth
                const { data: loginData, error: loginError } = await sb.auth.signInWithPassword({
                    email: emailParaLogin,
                    password: senha
                });
                if (loginError) throw loginError;

                // Super-admin (dono da plataforma): vai direto para o painel,
                // sem exigir perfil em "usuarios".
                try {
                    const { data: ehSuper } = await sb.rpc('is_super_admin');
                    if (ehSuper === true) {
                        window.location.href = "superadmin.html?t=" + Date.now();
                        return;
                    }
                } catch (e) { /* sem super-admin no ambiente: segue o fluxo normal */ }

                // Busca o perfil (nome/nível) pelo e-mail autenticado
                const { data: perfil, error: perfilError } = await sb
                    .from('usuarios')
                    .select('id, nome, nivel_acesso, ativo, empresa_id')
                    .eq('email', emailParaLogin)
                    .maybeSingle();
                if (perfilError || !perfil) {
                    await sb.auth.signOut();
                    throw new Error("Registro não encontrado na base de dados.");
                }
                if (!perfil.ativo) {
                    await sb.auth.signOut();
                    throw new Error("Usuário bloqueado. Fale com o administrador.");
                }

                // Carrega os dados da empresa (usados nos documentos / white-label)
                try {
                    const { data: emp } = await sb
                        .from('empresas')
                        .select('id, nome, slug, cnpj, telefone, endereco, logo_url, plano')
                        .eq('id', perfil.empresa_id)
                        .maybeSingle();
                    if (emp) localStorage.setItem('rv_empresa', JSON.stringify(emp));
                } catch (e) { /* sem empresa: segue com a marca padrao */ }

                // Salva na sessão
                localStorage.setItem('rv_user', JSON.stringify({
                    id: perfil.id,
                    nome: perfil.nome,
                    nivel: perfil.nivel_acesso,
                    empresaId: perfil.empresa_id
                }));

                // Redireciona
                window.location.href = "sistema.html?t=" + Date.now();

            } catch (err) {
                // Volta o botão e mostra erro
                btn.classList.remove('hidden');
                load.classList.add('hidden');
                load.classList.remove('flex');
                msgErro.textContent = err.message || "Usuário ou senha incorretos.";
                msgErro.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
