<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Névoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="application-name" content="Névoa">
    <meta name="apple-mobile-web-app-title" content="Névoa">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #4338ca; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-slate-900 p-6 flex flex-col items-center">
            <div class="w-20 h-20 rounded-full border-4 border-indigo-600 mb-3 shadow-lg bg-white overflow-hidden p-2">
                <img src="logo.png" class="w-full h-full object-contain" alt="Logo Névoa" />
            </div>
            <h1 class="text-2xl font-bold tracking-wider text-white">NÉVOA</h1>
            <p class="text-indigo-400 text-sm font-medium mt-1">Crie a conta da sua empresa</p>
        </div>

        <div class="p-8">
            <form id="cadastroForm" onsubmit="criarConta(event)" class="space-y-4">

                <div id="msg-erro" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-bold border border-red-200"></div>
                <div id="msg-ok" class="hidden bg-emerald-50 text-emerald-700 p-3 rounded-lg text-sm text-center font-bold border border-emerald-200"></div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nome da empresa *</label>
                    <div class="relative">
                        <i data-lucide="building-2" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="empresa" required placeholder="Ex.: Madeireira Nova Ltda" class="w-full p-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">CNPJ</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, número - Cidade/UF" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                </div>

                <hr class="border-slate-200">

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Seu nome (administrador) *</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="admin" required placeholder="Seu nome completo" class="w-full p-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">E-mail *</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                        <input type="email" id="email" required autocomplete="email" placeholder="voce@empresa.com.br" class="w-full p-3 pl-10 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Senha *</label>
                        <input type="password" id="senha" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Confirmar senha *</label>
                        <input type="password" id="senha2" required minlength="6" autocomplete="new-password" placeholder="Repita a senha" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
                    </div>
                </div>

                <button type="submit" id="btn-criar" class="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mt-2">
                    <span>Criar conta e entrar</span>
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>

                <div id="loading" class="hidden justify-center items-center gap-2 py-3">
                    <div class="loader"></div>
                    <span class="text-slate-500 font-bold text-sm">Criando sua conta...</span>
                </div>

                <p class="text-center text-sm text-slate-500 pt-2">
                    Já tem conta?
                    <a href="index.html" class="text-indigo-700 font-bold hover:underline">Entrar</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

        function mostrarErro(texto) {
            const el = document.getElementById('msg-erro');
            el.textContent = texto;
            el.classList.remove('hidden');
        }

        async function criarConta(e) {
            e.preventDefault();

            const empresa  = document.getElementById('empresa').value.trim();
            const cnpj     = document.getElementById('cnpj').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const admin    = document.getElementById('admin').value.trim();
            const email    = document.getElementById('email').value.trim().toLowerCase();
            const senha    = document.getElementById('senha').value;
            const senha2   = document.getElementById('senha2').value;

            const btn = document.getElementById('btn-criar');
            const load = document.getElementById('loading');
            document.getElementById('msg-erro').classList.add('hidden');
            document.getElementById('msg-ok').classList.add('hidden');
            btn.classList.add('hidden');
            load.classList.remove('hidden');
            load.classList.add('flex');

            try {
                if (!empresa) throw new Error('Informe o nome da empresa.');
                if (!admin) throw new Error('Informe o nome do administrador.');
                if (!email || !email.includes('@')) throw new Error('Informe um e-mail válido.');
                if ((senha || '').length < 6) throw new Error('A senha deve ter ao menos 6 caracteres.');
                if (senha !== senha2) throw new Error('As senhas não conferem.');

                const { data: su, error: suErr } = await sb.auth.signUp({ email, password: senha });
                if (suErr) throw suErr;

                if (!su.session) {
                    throw new Error('Conta criada, mas o e-mail precisa ser confirmado antes de entrar. Verifique sua caixa de entrada.');
                }

                const { data: ret, error: rpcErr } = await sb.rpc('criar_empresa_e_admin', {
                    p_empresa_nome: empresa,
                    p_admin_nome: admin,
                    p_cnpj: cnpj || null,
                    p_telefone: telefone || null,
                    p_endereco: endereco || null
                });
                if (rpcErr) {
                    await sb.auth.signOut();
                    throw rpcErr;
                }

                localStorage.setItem('rv_user', JSON.stringify({
                    id: ret && ret.usuario_id,
                    nome: admin,
                    nivel: 'admin'
                }));
                localStorage.setItem('rv_empresa', JSON.stringify({
                    id: ret && ret.empresa_id,
                    nome: empresa,
                    slug: ret && ret.slug,
                    cnpj: cnpj || null,
                    telefone: telefone || null,
                    endereco: endereco || null
                }));

                window.location.href = 'sistema.html?t=' + Date.now();

            } catch (err) {
                btn.classList.remove('hidden');
                load.classList.add('hidden');
                load.classList.remove('flex');
                mostrarErro(err.message || 'Não foi possível criar a conta.');
            }
        }
    </script>
</body>
</html>
